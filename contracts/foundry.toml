[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Arc Testnet supports Cancun (verified empirically in a prior deploy);
# OpenZeppelin v5.6 needs MCOPY, so don't downgrade this.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc = "https://rpc.testnet.arc.network"
